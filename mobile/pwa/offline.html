<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#fafafa">
<title>当前离线 · Hub Mobile</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --ink: #1d1d1f;
    --ink-soft: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1d1f;
      --card: #2c2c2e;
      --ink: #f5f5f7;
      --ink-soft: #aeaeb2;
      --border: #38383a;
      --accent: #0a84ff;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 22px; padding-bottom: calc(32px + env(safe-area-inset-bottom));
    line-height: 1.55;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 26px 26px; text-align: center;
  }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 18px;
    border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  h1 {
    margin: 0 0 8px; font-size: 19px; font-weight: 700;
    letter-spacing: -0.01em;
  }
  p {
    margin: 0 0 8px; font-size: 14px; color: var(--ink-soft);
  }
  .hint {
    margin-top: 18px; font-size: 12px; color: var(--ink-soft);
    text-align: left; background: var(--bg);
    border-radius: 10px; padding: 12px 14px;
    border: 1px solid var(--border);
  }
  .hint b { color: var(--ink); font-weight: 600; }
  .actions {
    display: flex; flex-direction: column; gap: 10px; margin-top: 22px;
  }
  button {
    width: 100%; padding: 13px 16px;
    font-size: 15px; font-weight: 600;
    font-family: inherit;
    border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card); color: var(--ink);
    transition: transform .12s ease, background .12s ease;
  }
  button:active { transform: scale(0.98); }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .status {
    margin-top: 14px; font-size: 12px; color: var(--ink-soft);
    min-height: 16px;
  }
  .status.ok { color: #34c759; }
  .status.err { color: #ff3b30; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>当前离线</h1>
    <p>没法连到 Hub，可能是网络断了或家里的 Hub 没开。</p>
    <div class="hint">
      <div><b>排查顺序</b></div>
      <div>1. 手机 4G/Wi-Fi 是否正常（打开微信看下）</div>
      <div>2. 家里 Hub 桌面图标是否在跑</div>
      <div>3. VPS lthub.xyz 是否可达</div>
    </div>
    <div class="actions">
      <button class="primary" id="btn-retry">重试连接</button>
      <button id="btn-home">返回首页</button>
    </div>
    <div class="status" id="status"></div>
  </div>
<script>
(function(){
  var btnRetry = document.getElementById('btn-retry');
  var btnHome = document.getElementById('btn-home');
  var statusEl = document.getElementById('status');
  function setStatus(text, cls) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }
  btnRetry.addEventListener('click', function() {
    setStatus('检测中…');
    // 用 HEAD /manifest.json 试探（轻量、走 SW cache miss 时会触发真实网络）
    fetch('/manifest.json?probe=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function(r) {
        if (r && r.ok) {
          setStatus('已恢复，正在跳转…', 'ok');
          setTimeout(function() { location.replace('/'); }, 400);
        } else {
          setStatus('网络仍不可达（HTTP ' + (r && r.status || '?') + '）', 'err');
        }
      })
      .catch(function() {
        setStatus('网络仍不可达，请稍后重试', 'err');
      });
  });
  btnHome.addEventListener('click', function() {
    location.replace('/');
  });
  // 自动监听 online 事件，恢复就闪一下提示
  window.addEventListener('online', function() {
    setStatus('检测到联网，可点上方重试', 'ok');
  });
})();
</script>
</body>
</html>
