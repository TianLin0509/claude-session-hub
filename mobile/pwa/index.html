<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AI Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ============= 配对屏 ============= -->
<div class="view pairing-screen" id="view-pairing">
  <div class="pair-logo">C</div>
  <div class="pair-title">输入配对码</div>
  <div class="pair-sub">桌面 Hub 显示 6 位数字<br>本机依次输入即登录</div>
  <div class="pair-pin" id="pair-pin">
    <span class="pin-cell cur"></span>
    <span class="pin-cell"></span>
    <span class="pin-cell"></span>
    <span class="pin-cell"></span>
    <span class="pin-cell"></span>
    <span class="pin-cell"></span>
  </div>
  <div class="pair-hub-target" id="pair-hub-target"></div>
  <div class="pair-error" id="pair-error"></div>
  <div class="pair-keypad" id="pair-keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key empty"></button>
    <button class="key" data-key="0">0</button>
    <button class="key del" data-key="del">⌫</button>
  </div>
  <div class="pair-steps">
    <div class="pair-step"><div class="pair-step-n">1</div>桌面 Hub → ⚙ 设置 → ⊕ 添加设备</div>
    <div class="pair-step"><div class="pair-step-n">2</div>看到放大显示的 6 位数字</div>
    <div class="pair-step"><div class="pair-step-n">3</div>本机输完即登录 · token 长期有效</div>
  </div>
</div>

<!-- ============= 主屏 ============= -->
<div class="view" id="view-main">
  <!-- T07 v0.5.1：navbar 5 按钮压成 3 按钮（☰ + 标题 + ✎），调试/历史/版本号挪到 drawer footer。
       标题压成单行：[hub-chip PID xxx] [• 连接 dot] [会话名（ellipsis）]，用 title 属性兜出全文。 -->
  <div class="navbar">
    <button class="nav-icon" aria-label="menu" id="btn-menu" title="会话与 Hub 切换">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-title" id="nav-title" data-conn="connecting" title="连接中…">
      <span class="hub-chip" id="nav-hub-chip" style="display:none"></span>
      <span class="dot" aria-hidden="true"></span>
      <span class="title-name" id="nav-title-name">手机会话</span>
      <!-- a11y：仅供 screen reader 读出当前连接态文字，视觉上由 dot 颜色表达 -->
      <span class="sr-only" id="conn-text">连接中…</span>
    </div>
    <button class="nav-icon" aria-label="new" id="btn-new">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </button>
  </div>
  <div class="pty-panel" id="pty-panel" hidden>
    <div class="pty-head">
      <div class="pty-title"><span class="pty-dot"></span><span id="pty-title-text">远程终端</span></div>
      <div class="pty-actions">
        <button type="button" id="pty-btn-ctrlc" title="发送 Ctrl+C">Ctrl+C</button>
        <button type="button" id="pty-btn-clear" title="清空本地显示">清屏</button>
      </div>
    </div>
    <div class="pty-screen" id="pty-screen" tabindex="0">等待远程终端...</div>
    <div class="pty-input-row">
      <input id="pty-input" class="pty-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="原始终端输入，Enter 发送">
      <button type="button" id="pty-btn-send">发送</button>
    </div>
  </div>
  <div class="stream" id="stream">
    <div class="tsline" id="empty-hint">向 Claude 发第一条消息…</div>
  </div>
  <div class="composer">
    <div class="composer-input" contenteditable="true" data-placeholder="给 Claude 发消息…" id="composer-input"></div>
    <button class="send-btn" aria-label="send" id="composer-send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12 L21 3 L17 12 L21 21 Z"/></svg>
    </button>
  </div>
</div>

<!-- ============= 全屏输入 modal（解决鸿蒙 PWA standalone 键盘遮挡） =============
     点 composer 输入区 → 弹全屏 modal（textarea 占满）→ 键盘弹起后 textarea 自然
     被 100dvh 压到键盘上方，光标始终可见。对照参考：iOS 短信"新消息"模式。 -->
<div class="input-modal" id="input-modal" aria-hidden="true">
  <div class="im-bar">
    <button class="im-btn im-cancel" id="im-btn-cancel" type="button">取消</button>
    <div class="im-title" id="im-title">新消息</div>
    <button class="im-btn im-send" id="im-btn-send" type="button" disabled>发送</button>
  </div>
  <textarea class="im-textarea" id="im-textarea" placeholder="给 Claude 发消息…"
            autocomplete="off" autocorrect="off" spellcheck="false"
            enterkeyhint="send"></textarea>
</div>

<!-- ============= AI Daily 全屏 view（iframe 嵌入） ============= -->
<div class="view view-aidaily" id="view-aidaily">
  <div class="aidaily-topbar">
    <button class="nav-icon" id="btn-aidaily-back" title="返回主屏" aria-label="back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="aidaily-title">🎬 AI Daily</div>
    <button class="nav-icon" id="btn-aidaily-reload" title="刷新" aria-label="reload">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <iframe id="aidaily-frame" class="aidaily-frame" title="AI Daily" loading="lazy"
          allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe>
</div>

<!-- ============= 会话 Drawer（左侧栏 = 会话列表） ============= -->
<div class="drawer-overlay" id="drawer-overlay" aria-hidden="true">
  <div class="drawer-mask"></div>
  <div class="drawer-panel" role="dialog" aria-label="会话列表">
    <div class="drawer-hdr">
      <div class="drawer-hub-label">当前 Hub</div>
      <div class="drawer-hub-name" id="drawer-hub-name"><span class="dot"></span><span class="hub-text">…</span></div>
      <button class="drawer-hub-switch" id="drawer-switch-hub">切换 Hub →</button>
    </div>
    <div class="drawer-search">
      <input type="text" id="drawer-search-input" placeholder="🔍 搜索会话标题…" autocomplete="off">
    </div>
    <!-- 发现分组：AI Daily 等独立 mini-app -->
    <div class="drawer-discover">
      <div class="drawer-section-label">发现</div>
      <button class="drawer-app-row" id="drawer-app-aidaily">
        <span class="d-icon" style="background:linear-gradient(135deg,#ff0050,#ff4f86);font-size:14px">🎬</span>
        <div class="d-meta">
          <div class="d-title">AI Daily</div>
          <div class="d-sub" style="color:var(--ink-mute)">反直觉发现 · 短视频 feed</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-mute)"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="drawer-section-label" style="padding:14px 16px 4px">会话</div>
    <div class="drawer-list" id="drawer-list"></div>
    <button class="drawer-new" id="drawer-new-session">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建会话
    </button>
    <!-- T07 v0.5.1：navbar 减按钮后，调试/历史/版本号挪到这里 -->
    <div class="drawer-actions" id="drawer-actions">
      <button class="drawer-action" id="drawer-debug-link" type="button">🐞 调试</button>
      <button class="drawer-action" id="drawer-history-link" type="button">🕘 历史</button>
      <button class="drawer-action" id="drawer-hub-view-link" type="button">&#128421; Hub View</button>
      <button class="drawer-action" id="drawer-push-link" type="button">🔔 通知</button>
      <span class="drawer-action-ver" id="drawer-ver"></span>
    </div>
    <div class="drawer-ftr">
      <span id="drawer-ftr-count">0 会话</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
